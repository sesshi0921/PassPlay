<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="passplay-plugin-id" content="old-maid">
<meta name="passplay-api-version" content="1.0">
<title>ババ抜き | PassPlay</title>
<link rel="stylesheet" href="../../core/game-theme.css">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app" data-passplay-plugin-root>
  <section class="phase is-active" data-phase="setup">
    <h1 class="title">ババ抜き</h1>
    <p class="lead">ルームを作成して、それぞれのスマホから参加します。</p>

    <div class="info-box setup-card">
      <label class="field" for="player-name">
        <span>あなたの名前</span>
        <input id="player-name" class="text-input" type="text" maxlength="16" autocomplete="nickname">
      </label>

      <div class="setup-note">
        <p>ホストは合言葉を決めてルームを作成、参加者は同じ合言葉を入力して参加します。</p>
      </div>

      <label class="field" for="room-label">
        <span>合言葉（空欄なら自動作成）</span>
        <input id="room-label" class="text-input" type="text" maxlength="24" placeholder="例: 今日のババ抜き" autocapitalize="none" autocomplete="off">
      </label>

      <div class="actions setup-actions">
        <button id="create-room" class="btn btn-primary" type="button">ルームを作る</button>
      </div>

      <div class="join-card">
        <label class="field" for="join-room-id">
          <span>合言葉で参加</span>
          <div class="join-row">
            <input id="join-room-id" class="text-input join-code-input" type="text" maxlength="24" placeholder="例: 今日のババ抜き" autocapitalize="none" autocomplete="off">
            <button id="join-room" class="btn btn-ghost join-button" type="button">参加</button>
          </div>
        </label>
      </div>
    </div>

    <p id="setup-error" class="inline-note" hidden></p>
    <div class="actions setup-actions">
      <a class="btn btn-ghost" href="../../index.html" data-passplay-home>トップへ戻る</a>
    </div>
  </section>

  <section class="phase" data-phase="room" hidden>
    <div class="room-shell">
      <div class="info-box room-hero">
        <p class="eyebrow">合言葉</p>
        <h2 id="room-code" class="room-code">------</h2>
        <button id="leave-room" class="btn btn-ghost room-leave-button" type="button">退出</button>
      </div>

      <div class="info-box room-card">
        <label class="field" for="invite-url">
          <span>招待URL</span>
          <div class="invite-row">
            <input id="invite-url" class="text-input" type="text" readonly>
            <button id="copy-invite" class="btn btn-ghost copy-button" type="button">コピー</button>
          </div>
        </label>
      </div>

      <div class="info-box room-card">
        <div class="panel-head">
          <h3>参加者</h3>
          <span id="room-status" class="count-badge">待機中</span>
        </div>
        <ul id="players-list" class="players-list"></ul>
        <div class="actions room-actions">
          <button id="start-game" class="btn btn-primary" type="button">ゲーム開始</button>
        </div>
      </div>
    </div>
  </section>

  <section class="phase" data-phase="play" hidden>
    <div class="play-shell board-shell">
      <div id="selection-popup" class="selection-popup" hidden></div>
      <div id="pairing-overlay" class="pairing-overlay" hidden>
        <div class="pairing-copy">
          <h3 id="pairing-title">手札を配っています...</h3>
          <p id="pairing-note">そろった数字を自分で捨ててください。</p>
        </div>
        <div id="pairing-timer" class="pairing-timer">15</div>
        <div class="actions pairing-actions">
          <button id="pairing-ready" class="btn btn-primary" type="button">準備完了</button>
        </div>
      </div>
      <div id="start-banner" class="start-banner" hidden>ゲーム開始！</div>

      <div class="table-shell">
        <div class="table-head">
          <div>
            <p id="turn-label" class="turn-label">同期中...</p>
            <p id="target-label" class="target-label"></p>
          </div>
          <div class="table-head-meta">
            <span id="turn-timer" class="count-badge">--</span>
            <span id="play-room-code" class="count-badge">------</span>
          </div>
        </div>

        <div class="table-arena">
          <div id="player-ring" class="player-ring"></div>

          <div class="discard-zone">
            <div id="discard-pile" class="discard-pile"></div>
          </div>
        </div>
      </div>

      <div class="target-overlay" id="target-panel">
        <div class="target-overlay-head">
          <h3>引く相手の手札</h3>
          <span class="mini-note">ダブルタップで取る</span>
        </div>
        <div id="target-hand" class="target-stack"></div>
      </div>

      <div class="hand-dock">
        <div class="hand-dock-head">
          <h3>あなたの手札</h3>
          <span class="mini-note">最大2枚アピール</span>
        </div>
        <div class="hand-dock-body">
          <div id="hand-overlay" class="hand-overlay"></div>
          <div id="my-hand" class="my-hand fan-hand"></div>
        </div>
      </div>

      <div id="draw-animation-card" class="draw-animation-card" hidden></div>
    </div>
  </section>

  <section class="phase" data-phase="result" hidden>
    <h2 class="title">ゲーム終了</h2>
    <div id="result-summary" class="info-box result-summary"></div>
    <div class="actions">
      <button id="leave-after-result" class="btn btn-primary" type="button">部屋を閉じる</button>
      <a class="btn btn-ghost" href="../../index.html" data-passplay-home>トップへ戻る</a>
    </div>
  </section>
</main>
<script src="../../core/plugin-sdk.js"></script>
<script src="./game.js"></script>
</body>
</html>
