<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<title>PassPlay</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="icon-marquee" aria-hidden="true">
      <div id="icon-marquee-row-1" class="icon-marquee-row"></div>
      <div id="icon-marquee-row-2" class="icon-marquee-row icon-marquee-row-reverse"></div>
    </div>
    <div class="brand-lockup">
      <h1>PassPlay</h1>
      <p class="subtitle">パスして遊ぶみんなのゲーム</p>
    </div>
  </header>

  <nav class="mode-switch" role="tablist" aria-label="プレイモード">
    <button
      id="mode-single"
      class="mode-button"
      type="button"
      role="tab"
      aria-selected="true"
      aria-controls="single-mode-panel"
      data-mode="single"
    >
      <span class="mode-button-title">1台で遊ぶ</span>
      <span class="mode-button-note">スマホを回してプレイ</span>
    </button>
    <button
      id="mode-multi"
      class="mode-button"
      type="button"
      role="tab"
      aria-selected="false"
      aria-controls="multi-mode-panel"
      data-mode="multi"
    >
      <span class="mode-button-title">みんなのスマホ</span>
      <span class="mode-button-note">各自の端末でプレイ</span>
    </button>
  </nav>

  <div
    id="single-mode-panel"
    class="mode-panel is-active"
    role="tabpanel"
    aria-labelledby="mode-single"
    data-mode-panel="single"
  >
    <section class="games-section">
      <h2 class="section-title">1台で遊べるゲーム</h2>
      <div id="games-grid" class="games-grid" aria-live="polite"></div>
    </section>

    <div id="players-backdrop" class="players-backdrop" hidden></div>
    <section id="players-sheet" class="players-section" aria-labelledby="players-toggle-label">
      <button
        id="players-toggle"
        class="players-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="players-sheet-content"
      >
        <span id="players-toggle-label">プレイヤー <strong id="players-count">0</strong>人</span>
        <span class="players-toggle-icon" aria-hidden="true"></span>
      </button>
      <div id="players-sheet-content" class="players-sheet-content" aria-hidden="true" inert>
        <form id="player-form" class="player-form" autocomplete="off">
          <input id="player-input" class="player-input" type="text" placeholder="名前を入力" maxlength="16" required>
          <button class="btn-add" type="submit">追加</button>
        </form>
        <ul id="players-list" class="players-list"></ul>
      </div>
    </section>
  </div>

  <div
    id="multi-mode-panel"
    class="mode-panel"
    role="tabpanel"
    aria-labelledby="mode-multi"
    data-mode-panel="multi"
    hidden
  >
    <section class="multi-empty" aria-labelledby="multi-empty-title">
      <div class="multi-empty-icon" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <p class="multi-empty-label">MULTI DEVICE</p>
      <h2 id="multi-empty-title">対応ゲーム準備中</h2>
      <p>ルームを作って、それぞれのスマホから参加できるゲームを追加予定です。</p>
      <div class="multi-empty-status">ゲーム 0件</div>
    </section>
    <section class="multi-profile" aria-labelledby="multi-username-label">
      <label id="multi-username-label" for="multi-username">あなたの名前</label>
      <input
        id="multi-username"
        class="multi-username-input"
        type="text"
        placeholder="ユーザーネームを入力"
        maxlength="16"
        autocomplete="nickname"
      >
    </section>
  </div>
</div>

<script src="./app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' })
    .then(reg => reg.update())
    .catch(err => console.log('SW registration failed:', err));
}
</script>
</body>
</html>
