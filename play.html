<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<title>ゲーム | PassPlay</title>
<link rel="stylesheet" href="./core/plugin-host.css">
<style>
html,body,#plugin-host,.plugin-frame{background:#f2f2f0!important}
</style>
</head>
<body>
<main id="plugin-host" class="plugin-host" aria-live="polite">
  <button id="plugin-exit-button" class="plugin-exit-button" type="button" aria-haspopup="dialog">退出</button>
  <div id="plugin-exit-dialog" class="plugin-exit-dialog" role="dialog" aria-modal="true" aria-labelledby="plugin-exit-title" hidden>
    <div class="plugin-exit-panel">
      <h2 id="plugin-exit-title">このゲームから退出しますか？</h2>
      <div class="plugin-exit-actions">
        <button id="plugin-exit-cancel" class="plugin-exit-cancel" type="button">いいえ</button>
        <button id="plugin-exit-confirm" class="plugin-exit-confirm" type="button">はい</button>
      </div>
    </div>
  </div>
  <div id="plugin-loading" class="plugin-status plugin-loading">
    <div class="loading-toys" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <p class="loading-brand">PassPlay</p>
    <p class="loading-message">ゲームを読み込んでいます...</p>
  </div>
  <div id="plugin-error" class="plugin-status plugin-error" hidden>
    <h1>ゲームを起動できません</h1>
    <p id="plugin-error-message"></p>
    <a href="./index.html">トップへ戻る</a>
  </div>
</main>
<script>
if ('serviceWorker' in navigator) {
  let reloadingForUpdate = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloadingForUpdate) return;
    reloadingForUpdate = true;
    window.location.reload();
  });
  navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' })
    .then(registration => registration.update())
    .catch(error => console.log('SW registration failed:', error));
}
</script>
<script src="./core/room-runtime.js"></script>
<script src="./core/plugin-host.js"></script>
</body>
</html>
